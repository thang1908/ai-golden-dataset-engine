[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-direct-annotation"
version = "0.1.0"
description = "Direct V-LLM Medium generation for person-image captions and attributes"
readme = "g1_direct_annotation/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["siglip_model: requires the local SigLIP ONNX model and runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.setuptools.packages.find]
include = ["g1_direct_annotation*", "g2_facts_then_caption*", "g3_consensus_annotation*", "g4_critic_verifier*", "g5_qa_refinement*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
g1_direct_annotation = ["attribute_schema.json", ".env.example"]
g2_facts_then_caption = ["attribute_schema.json", ".env.example"]
g3_consensus_annotation = ["attribute_schema.json", ".env.example"]
g4_critic_verifier = ["attribute_schema.json", ".env.example"]
g5_qa_refinement = ["attribute_schema.json", ".env.example"]
