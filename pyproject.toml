[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-dataset-harness"
version = "0.1.0"
description = "AI Golden Dataset Generation Harness for person image annotation"
readme = "golden_dataset_harness/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Workflow orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # Data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # HTTP client (for VLM API calls)
    "httpx>=0.27",

    # Image processing
    "Pillow>=10.0",

    # Configuration
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["siglip_model: requires the local SigLIP ONNX model and runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.setuptools.packages.find]
include = ["golden_dataset_harness*", "c1_vllm_medium*", "c2_siglip*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
golden_dataset_harness = ["configs/*.yaml", "api/templates/*.html"]
c1_vllm_medium = ["attribute_schema.json", ".env.example"]
