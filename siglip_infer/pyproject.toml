[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siglip-infer"
version = "2.0.0"
description = "Standalone SigLIP person embedding, attribute prediction, and text query encoding"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "onnxruntime>=1.20,<2",
    "pillow>=11,<12",
    "tokenizers>=0.21,<1",
    "ftfy>=6.3,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gpu = ["onnxruntime-gpu>=1.20,<2"]

[project.scripts]
siglip-infer = "siglip_infer.cli:main"

[tool.setuptools]
packages = ["siglip_infer"]

[tool.setuptools.package-data]
siglip_infer = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires the ONNX model files in models/"]
