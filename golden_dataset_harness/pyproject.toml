[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golden-dataset-harness"
version = "0.1.0"
description = "AI Golden Dataset Generation Harness for person image annotation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Workflow orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # Data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Object storage
    "minio>=7.2",

    # ML / Embeddings
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",

    # HTTP client (for VLM API calls)
    "httpx>=0.27",

    # Image processing
    "Pillow>=10.0",

    # Configuration
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "configs", "evaluation", "models", "schemas", "storage", "workflow"]
# Include the root __init__.py
[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "golden_dataset_harness/__init__.py"

[tool.mypy]
python_version = "3.11"
strict = true
