# =============================================================================
# Pipeline Settings
# =============================================================================

# --- Model Configuration ---
model:
  # Host, OAuth credentials and model are read from golden_dataset_harness/.env.
  provider: "openai-compatible"

# --- Caption Generation ---
caption:
  # Number of caption candidates to generate per image
  num_candidates: 5

  # Temperature for diversity across candidates
  temperature: 0.7

  # Max tokens per caption
  max_tokens: 256

# --- Consensus Engine ---
consensus:
  # Sentence-transformer model for embedding similarity
  embedding_model: "all-MiniLM-L6-v2"

  # Minimum similarity to consider captions as agreeing
  similarity_threshold: 0.75

# --- Confidence Scoring ---
confidence:
  # Weights for confidence fusion
  judge_weight: 0.4
  consensus_weight: 0.3
  grounding_weight: 0.3

  # Threshold for auto-acceptance
  acceptance_threshold: 0.75

# --- API ---
api:
  host: "0.0.0.0"
  port: 8000

# --- Batch Processing ---
batch:
  # Max concurrent image processing tasks
  max_concurrency: 4
